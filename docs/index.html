<script>
(() => {
'use strict';
// LOOK APPLE (Jawed 25/11) : lien /apple/ ou ?look=apple ; ?look=base = look actuel
{ const lk = new URLSearchParams(location.search).get('look'); if (lk === 'apple' || (lk !== 'base' && lk !== 'neon' && /\/apple\//.test(location.pathname))) document.documentElement.classList.add('apple'); else if (lk !== 'base') document.documentElement.classList.add('neon'); }
// ---------- Source des données ----------
// Sur le vrai site, le serveur définit window.CYCLOM_API (ex. "/api/moi"). Sans ça : aperçu avec demo.json.
// Trois sources : 'site' (window.CYCLOM_API, serveur Cyclom), 'drive' (dashboard perso : fichier du relevé cloud sur Google Drive), 'demo' (demo.json).
const API = window.CYCLOM_API || null;
const SITE = !!API;
const SRC = document.querySelector('meta[name="cyclom-source"]')?.content;
const WEB = !SITE && SRC === 'web';                       // page web (GitHub Pages) : données chiffrées, mot de passe
const DRIVE = !SITE && (SRC === 'drive' || WEB);          // même comportement que le dashboard perso
let COV = {};
const TZ = 'Europe/Paris';
const JOURS = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const JOURS_L = ['lundi','mardi','mercredi','jeudi','vendredi','samedi','dimanche'];

let RAW = null, ACC = 'tous', VIEW = 'direct', AGENCE = false;
try { AGENCE = !!localStorage.getItem('cs_agence'); } catch (e) {}
const st = { jour:null, an:'vue', dvue:'monte', q:'', per:'tout', sort:'recent', shown:60, hPer:14, hMet:'g', slotMode:'post', slotSel:null, slotPer:28, heat:false, flt:'', vmode:'grille', hourSel:null };
let CTX = []; const SCROLL = {};
const ORDRE = ['direct','videos','historique','creneaux','campagnes']; // = ordre du menu en bas (Codex NAV-01)
try { const s = JSON.parse(localStorage.getItem('cs_ui') || '{}'); if (ORDRE.includes(s.view)) VIEW = s.view; if (typeof s.acc === 'string') ACC = s.acc; } catch (e) {}
const save = () => { try { localStorage.setItem('cs_ui', JSON.stringify({ view: VIEW, acc: ACC })); } catch (e) {} };

// ---------- Outils ----------
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const nb_ = t => t.replace(/\u202f/g, '\u00a0');
const fmt = n => n == null || isNaN(n) ? '—' : nb_(Math.round(n).toLocaleString('fr-FR'));
const k = n => { if (n == null || isNaN(n)) return '—'; const a = Math.abs(n);
  if (a >= 1e6) return (n / 1e6).toLocaleString('fr-FR', { maximumFractionDigits: a >= 1e7 ? 1 : 2 }) + ' M';
  if (a >= 1e4) return (n / 1e3).toLocaleString('fr-FR', { maximumFractionDigits: a >= 1e5 ? 0 : 1 }) + ' k';
  return fmt(n); };
const fx = f => f.toLocaleString('fr-FR', { maximumFractionDigits: f >= 10 ? 0 : 1 }) + '×';
// largeur de dessin des graphiques : ~ la vraie largeur affichée, pour que les textes des axes restent petits et nets (PC compris)
const CW = (feuille) => innerWidth >= 960 ? (feuille ? 520 : 820) : 340;
const pct = (a, b) => b > 0 ? (a - b) / b * 100 : null;
const pctTxt = p => p == null ? '' : (p >= 0 ? '+' : '−') + Math.abs(p).toLocaleString('fr-FR', { maximumFractionDigits: Math.abs(p) < 10 ? 1 : 0 }) + ' %';
const median = a => { const s = a.filter(x => x != null && !isNaN(x)).sort((x, y) => x - y); if (!s.length) return null; const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const parts = new Intl.DateTimeFormat('fr-FR', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', weekday: 'short', hourCycle: 'h23' });
// date de Paris d'un instant : calcul coûteux (Intl), appelé des milliers de fois par page → gardé en mémoire (24/11 : onglets 2× plus rapides)
const PZC = new Map();
function pz(ms) { const c = PZC.get(ms); if (c) return c; const o = {}; for (const p of parts.formatToParts(new Date(ms))) o[p.type] = p.value;
  const wd = ['lun.','mar.','mer.','jeu.','ven.','sam.','dim.'].indexOf(o.weekday);
  const r = Object.freeze({ day: o.year + o.month + o.day, hour: +o.hour, key: o.year + o.month + o.day + o.hour.padStart(2, '0'), wd: wd < 0 ? 0 : wd });
  if (PZC.size > 60000) PZC.clear(); PZC.set(ms, r); return r; }
const dayLabel = d => { const dt = new Date(+d.slice(0, 4), +d.slice(4, 6) - 1, +d.slice(6, 8)); return JOURS[(dt.getDay() + 6) % 7] + ' ' + d.slice(6, 8) + '/' + d.slice(4, 6); };
const ago = ms => { const m = Math.round((Date.now() - ms) / 60000); if (m < 1) return "à l'instant"; if (m < 60) return 'il y a ' + m + ' min'; const h = Math.floor(m / 60); if (h < 24) return 'il y a ' + h + ' h'; return 'il y a ' + Math.floor(h / 24) + ' j'; };
const dateVid = t => new Date(t * 1000).toLocaleString('fr-FR', { timeZone: TZ, day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }).replace(' ', ' à ');
const tags = d => (String(d || '').toLowerCase().match(/#[\p{L}\p{N}_]+/gu) || []).map(t => t.slice(1));
const casse = t => t && t === t.toUpperCase() && /[A-Z]{4}/.test(t) ? t.toLowerCase().replace(/(^|[\s\-—(])(\p{L})/gu, (m, a, b) => a + b.toUpperCase()) : t;
const titreVid = v => { const t = sansTags(v.d); if (t) return t; const c = tags(v.d).find(x => x.startsWith('cyclomx'));
  const nomC = c ? ((RAW?.campagnes || []).find(x => x.tag === c)?.nom || '#' + c) : 'Vidéo'; return nomC + (v.du ? ' · ' + v.du + ' s' : '') + ' · ' + dateVid(v.t); };
const sansTags = d => String(d || '').replace(/#[\p{L}\p{N}_]+/gu, '').replace(/\s+/g, ' ').trim();
const cover = (v, cls = '') => (v.cover = v.cover || COV[v.id]) ? `<img src="${esc(v.cover)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" class="${cls}" data-ph="${esc(sansTags(v.d).slice(0, 60))}">` : `<div class="ph ${cls}"><span>${esc(sansTags(v.d).slice(0, 60))}</span></div>`;
// couverture qui ne charge plus (lien TikTok expiré) : on remet le texte de la vidéo à la place
document.addEventListener('error', e => { const i = e.target; if (i.tagName !== 'IMG' || !i.hasAttribute('data-ph')) return;
  const d = document.createElement('div'); d.className = 'ph ' + i.className; d.textContent = i.dataset.ph; i.replaceWith(d); }, true);

// ---------- Préférences du clippeur (gardées sur son téléphone) ----------
const PREF = (() => { try { return JSON.parse(localStorage.getItem('cs_pref') || '{}'); } catch (e) { return {}; } })();
const savePref = () => { try { localStorage.setItem('cs_pref', JSON.stringify(PREF)); } catch (e) {} };
// montants officiels Cyclom : toujours au centime près (pas d'arrondi sur l'argent du clippeur)
const eur2 = n => n == null || isNaN(n) ? '—' : nb_(n.toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })) + ' €';
const eur = n => n == null || isNaN(n) ? '—' : nb_(n.toLocaleString('fr-FR', { maximumFractionDigits: n < 100 ? 2 : 0, minimumFractionDigits: n < 100 ? 2 : 0 })) + '\u00a0€';
const estCamp = t => t.startsWith('cyclomx') || (RAW.campagnes || []).some(c => c.tag === t);
// tarif d'une campagne en € pour 1000 vues : celui réglé par le clippeur, sinon celui donné par l'agence
const tarif = t => enCours(t) ? (RAW.campagnes || []).find(c => c.tag === t)?.cpm ?? null : null;
// ---------- Campagne EN COURS (Jawed 24/11 : « Djadel Show c'est fini, t'es pas à jour ») : seul cyclom.fr décide (classement + infos
// campagnes : terminee / date de fin), plus JAMAIS une liste écrite en dur. Sur le serveur Cyclom, son statut officiel compte aussi.
const finCamp = c => c.terminee ? 0 : c.fin ? new Date(c.fin + 'T23:59:00').getTime() : 0;
const campOfficielles = () => [...((RAW.classement || CLASSEMENT)?.campagnes || []), ...infosCampagnes()];
function campActive() { const now = Date.now(); return campOfficielles().find(c => finCamp(c) > now) || null; }
function enCours(tag) { const now = Date.now(); return campOfficielles().some(c => c.tag === tag && finCamp(c) > now); }
// ses sous chez Cyclom (chiffres OFFICIELS de l'admin cyclom.fr : gagné, versé, dernier versement, par campagne), pour le compte affiché.
// Une personne = tous ses comptes réunis ; marche pour n'importe quel clippeur (le serveur ne lui envoie que le sien).
function monSolde(A) {
  const L = (RAW.classement || CLASSEMENT)?.soldes; if (!L?.length) return null;
  const moi = mesComptesTT(A), M = L.filter(x => (x.comptes || []).some(c => moi.has(String(c).toLowerCase())));
  if (!M.length) return null;
  const o = { gagne: 0, verse: 0, paye_le: null, camp: {} };
  for (const x of M) { o.gagne += x.gagne || 0; o.verse += x.verse || 0; if (x.paye_le && (!o.paye_le || x.paye_le > o.paye_le)) o.paye_le = x.paye_le;
    for (const [id, c] of Object.entries(x.campagnes || {})) { const d = o.camp[id] = o.camp[id] || { gain: 0, verse: 0 }; d.gain += c.gain || 0; d.verse += c.verse || 0; } }
  o.reste = Math.max(0, Math.round((o.gagne - o.verse) * 100) / 100);
  return o;
}
const ordP = n => n === 1 ? '1er' : n + 'e';
const rang = (x, l) => (l && l[x.cle]) || (x.tri.indexOf(l) + 1); // place officielle cyclom.fr
function gains(A) {
  let auj = 0, tot = 0, ok = false;
  for (const v of A.videos) { const t = tags(v.d).find(x => tarif(x) != null); if (!t) continue; ok = true; const r = tarif(t) / 1000; auj += (v.gj || 0) * r; tot += v.v * r; }
  return ok ? { auj, tot } : null;
}
// objectif de vues du jour : réglé par le clippeur, sinon ~10 % au-dessus de son rythme récent (médiane des 3 derniers jours)
function objectif(A, C) {
  const o = PREF.obj?.[A.id]; if (o) return { v: o, auto: false };
  const cle = A.id + ':' + C.P.day, fixe = PREF.objJour?.[cle]; if (fixe) return { v: fixe, auto: true };
  const Q = A.quotidien || {}, l = []; for (let i = 1; i <= 3; i++) { const g = Q[addJour(C.P.day, -i)]?.g; if (g) l.push(g); }
  const m = median(l); if (!m) return null;
  // atteignable : un peu au-dessus du rythme récent, mais jamais plus de 20 % au-dessus de l'estimation du jour (sinon ça décourage)
  const now = C.now / 1000, par = median(A.videos.filter(x => now - x.t > 86400 && now - x.t < 14 * 86400 && !x.r).map(x => x.ms?.['24'] ?? x.v)) || 0;
  let v = m * 1.05; if (C.est && v > C.est + 3 * par) v = C.est + 3 * par; // faisable : ce qui est prévu + 3 bonnes vidéos

  const cumAt = (day, h, f) => { let s = 0, ok = false; for (let i = 0; i < h; i++) { const v = H[day + String(i).padStart(2, '0')]; if (v != null) { s += v; ok = true; } }
    const v = H[day + String(h).padStart(2, '0')]; if (v != null) { s += v * f; ok = true; } return ok ? s : null; };
  const today = A.jour?.gained ?? 0;
  const md = now - ((P.hour * 60 + new Date(now).getMinutes()) * 60e3);
  const partiel = A.jour?.since && A.jour.since - md > 20 * 60e3 ? A.jour.since : null; // relevé commencé en cours de journée
  const ySame = partiel ? null : cumAt(yd, P.hour, frac);
  const yTot = A.quotidien?.[yd]?.g ?? cumAt(yd, 24, 0);
  // estimation : part de la journée habituellement faite à cette heure (7 derniers jours complets)
  const fr = [];
  for (let i = 1; i <= 7; i++) { const d = addJour(P.day, -i); const tot = A.quotidien?.[d]?.g; const c = cumAt(d, P.hour, frac);
    let hours = 0; for (let h = 0; h < 24; h++) if (H[d + String(h).padStart(2, '0')] != null) hours++;
    if (tot > 0 && c != null && hours >= 20) fr.push(c / tot); }
  const f = median(fr);
  const est = !partiel && f && f > 0.04 ? today / f : null;
  // normale par âge : médiane des vues à 1/3/6/12/24 h
  const msMed = {}; for (const m of ['1','3','6','12','24']) msMed[m] = median(A.videos.slice(0, 300).map(v => v.ms?.[m]).filter(x => x > 0));
  const vieux = A.videos.filter(v => now / 1000 - v.t > 2 * 86400).slice(0, 60);
  const normal = median(vieux.map(v => v.v));
  const attendu = age => { let m = null; for (const x of ['1','3','6','12','24']) if (age >= +x && msMed[x]) m = x;
    return age > 30 ? normal : m ? msMed[m] : msMed['1']; };

  const suspecte = v => { const age = (now / 1000 - v.t) / 3600; if (age < 2 || age > 72 || v.r) return false; const ref = attendu(age); return ref >= 500 && v.v < ref * .15; };
  const duJour = A.videos.filter(v => pz(v.t * 1000).day === P.day);
  return { now, P, yd, today, ySame, yTot, est, normal, fois, suspecte, duJour, partiel, Q: A.quotidien?.[P.day] || {} };
}

function phrase(A, C) {

  // ---------- trait lumineux sous le gros chiffre (à l'ouverture d'une page, jamais au rafraîchissement silencieux) ----------
  const _render = render;
  render = function () {
    const doux = !!MV?.doux; _render.apply(this, arguments);

  // - listes (diagnostic, « pourquoi tes vues », jours, campagnes) : arrivent l'une après l'autre comme des notifs

  function choregraphie() {

      const traits = [...svg.querySelectorAll('path,polyline')].filter(x => x.getAttribute('fill') === 'none' && !x.getAttribute('stroke-dasharray') && (x.getAttribute('stroke') || '').match(/#|var|url|rgb/));
      for (const t of traits.slice(0, 3)) { let L = 0; try { L = t.getTotalLength(); } catch (e) {} if (!L) continue;

      for (const a of [...svg.querySelectorAll('path')].filter(x => x.getAttribute('fill') && x.getAttribute('fill') !== 'none')) a.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 700, delay: 350, easing: 'ease-out', fill: 'backwards' });
      const barres = [...svg.querySelectorAll('rect')].filter(r => +r.getAttribute('height') > 0 && +r.getAttribute('width') < 60);
      if (barres.length >= 4) barres.forEach((r, i) => { r.style.transformBox = 'fill-box'; r.style.transformOrigin = '50% 100%';
        r.animate([{ transform: 'scaleY(0)' }, { transform: 'scaleY(1)' }], { duration: 560, delay: Math.min(i * 16, 420), easing: IO, fill: 'backwards' }); });
    }
    for (const html of main.querySelectorAll('.hb .tr, .obj .tr')) if (visible(html)) html.querySelectorAll(':scope > i').forEach((i, k) => { i.style.transformOrigin = '0 50%'; i.animate([{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], { duration: 700, delay: k * 30, easing: FREIN, fill: 'backwards' }); });
    let k = 0;
    for (const row of main.querySelectorAll('.in, .cp-row, .jours > *, .rows > *, .plan > :not(.sec-h), .pl, .cd')) {
      if (k > 10 || !visible(row)) continue;
      row.animate([{ opacity: 0, transform: 'translate3d(0,8px,0)' }, { opacity: 1, transform: 'none' }], { duration: 380, delay: 80 + k++ * 32, easing: IO, fill: 'backwards' });
    }

      o.animate([{ transform: 'scale(1)', opacity: .9 }, { transform: 'scale(2)', opacity: 0 }], { duration: 900, delay: 500, easing: 'cubic-bezier(.2,.7,.3,1)', fill: 'both' }).finished.then(() => o.remove(), () => o.remove()); }

    setTimeout(sortir, 1650);
    addEventListener('pointerdown', sortir, { once: true, capture: true });
  }

})();

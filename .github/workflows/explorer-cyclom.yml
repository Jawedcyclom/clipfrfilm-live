name: explorer-cyclom
# Lancé À LA MAIN seulement : lit l'espace agence cyclom.fr une fois et écrit le résultat sur le Drive privé (rien dans le journal public)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  explorer:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: curl -s https://rclone.org/install.sh | sudo bash > /dev/null
      - name: config rclone
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: mkdir -p ~/.config/rclone && printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
      - run: python tools/cyclom_explorer.py
        env:
          PYTHONUNBUFFERED: '1'
          CYCLOM_ADMIN_CLE: ${{ secrets.CYCLOM_ADMIN_CLE }}
          MOI_COMPTES: clipfrfilm,actuclip.film,clip2dz,france.clip2

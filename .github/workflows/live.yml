name: releve-live
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  actions: write
  contents: write
concurrency:
  group: live
  cancel-in-progress: false
jobs:
  releve:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - run: echo "DEBUT=$(date +%s)" >> $GITHUB_ENV
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q yt-dlp curl_cffi pillow cryptography
      - run: curl -s https://rclone.org/install.sh | sudo bash > /dev/null
      - name: config rclone
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: mkdir -p ~/.config/rclone && printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
      - run: python tools/cloud_live.py
        env:
          TZ: Europe/Paris
          PYTHONUNBUFFERED: '1'
          CYCLOM_SERVEUR: ${{ secrets.CYCLOM_SERVEUR }}
          CYCLOM_CLE: ${{ secrets.CYCLOM_CLE }}
      - name: classement Cyclom (cyclom.fr vers Drive et serveur, nettoyé)
        continue-on-error: true
        run: python tools/cyclom_classement.py
        env:
          TZ: Europe/Paris
          PYTHONUNBUFFERED: '1'
          CYCLOM_ADMIN_CLE: ${{ secrets.CYCLOM_ADMIN_CLE }}
          CYCLOM_SERVEUR: ${{ secrets.CYCLOM_SERVEUR }}
          CYCLOM_CLE: ${{ secrets.CYCLOM_CLE }}
      - name: ce qui marche sur les campagnes (page publique cyclom.fr)
        continue-on-error: true
        run: python tools/cyclom_campagnes.py
        env:
          TZ: Europe/Paris
          CYCLOM_SERVEUR: ${{ secrets.CYCLOM_SERVEUR }}
          CYCLOM_CLE: ${{ secrets.CYCLOM_CLE }}
      - name: alertes sur le téléphone (ntfy)
        continue-on-error: true
        run: python tools/alertes.py
        env:
          TZ: Europe/Paris
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Publier les statistiques chiffrées
        continue-on-error: true
        run: python tools/publier_chiffre.py
        env:
          DASH_MDP: ${{ secrets.DASH_MDP }}
          GH_TOKEN: ${{ github.token }}
      - name: relancer le relevé suivant (5 min après le début de celui-ci)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          reste=$(( 300 - ($(date +%s) - DEBUT) ))
          [ $reste -gt 0 ] && sleep $reste
          gh workflow run live.yml -R ${{ github.repository }}
